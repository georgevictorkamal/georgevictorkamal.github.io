  <!-- Suppress Vite HMR deprecated unload event listener warning -->
  <script>
    // Store the original console.warn before anything else can modify it
    const _originalConsoleWarn = console.warn;

    // Create a wrapper that filters the deprecation warning
    const _filteringWarn = function () {
      const msg = String(arguments[0] || '');
      // Filter out Vite HMR unload event deprecation warning
      if (msg.includes('Unload event listeners are deprecated')) {
        return;
      }
      // Call the original warn
      return _originalConsoleWarn.apply(this, arguments);
    };

    // Replace console.warn
    console.warn = _filteringWarn;
  </script>

  <!-- Apply the saved or system theme before first paint to avoid a flash of the wrong mode -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme-preference');
        var systemDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          stored === 'light' || stored === 'dark' ? stored : systemDark ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#030712' : '#f8fafc');
      } catch (error) {
        // Theme detection is optional; the app falls back to the light palette.
      }
    })();
  </script>
