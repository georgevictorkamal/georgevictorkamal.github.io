  <!-- Suppress Vite HMR deprecated unload event listener warning -->
  <script>
    // Store the original console.warn before anything else can modify it
    const _originalConsoleWarn = console.warn;

    // Create a wrapper that filters the deprecation warning
    const _filteringWarn = function () {
      const msg = String(arguments[0] || '');
      // Filter out Vite HMR unload event deprecation warning
      if (msg.includes('Unload event listeners are deprecated')) {
        return;
      }
      // Call the original warn
      return _originalConsoleWarn.apply(this, arguments);
    };

    // Replace console.warn
    console.warn = _filteringWarn;
  </script>
